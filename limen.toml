[module]
name = "crowdstrike-network"
display_name = "Fleet network"
version = "0.2.0"
language = "python"
entry = "src/main.py"
description = "List the network interfaces on CrowdStrike fleet hosts over RTR — addresses, MACs, gateways, DNS and link state, per host."
authors = ["Limen"]
repo = "CRC-BARRACUDA/limen-crowdstrike-network"

[provides]
capabilities = ["crowdstrike.network"]

# Needs the crowdstrike module for auth (token + API base) and the inventory.
[requires.capabilities]
"crowdstrike" = ">=0.1"

# Installing this pulls the crowdstrike module too.
[dependencies]
crowdstrike = "CRC-BARRACUDA/limen-crowdstrike"

# Optional: if a report provider is installed, a "Make Report" action appears.
[optional.capabilities]
"report.build" = ">=0.1"

[permissions]
# Reaches the Falcon API directly (RTR endpoints).
network = ["*.crowdstrike.com"]
# Runs scripts on remote fleet hosts. The fleet scan only reads the interface
# tables. The host panel can also ask it to CHANGE interfaces — addresses,
# gateways, DNS, metrics, network profiles; disconnect, connect, delete and
# create them — and it does, after the user has drafted the changes and
# accepted a window listing every one. This executes code on your fleet, and
# some of it changes how a host reaches the network.
run_hosts = true

# Deliberately NOT here:
#
#   may_require_admin — that field means Limen's *own* machine may need
#     administrator rights, and this module needs none: it makes HTTPS calls to
#     the Falcon API and nothing else. The privilege it needs is Falcon-side and
#     remote (the RTR admin tier, for `runscript`), which is a scope on the API
#     client rather than anything about this workstation.
#
#   elevate — never asks the host to run anything as root locally.
#
#   elevated_methods — `run_hosts` above already says, on the approval screen,
#     that this module executes on fleet hosts, and that is consented to once
#     when the module is trusted.
